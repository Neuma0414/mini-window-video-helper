# 与上游 apades/dmMiniPlayer v0.6.15 的差异（详见 NOTICE.md 第 33 项）：
#   1. 构建增加 --metafile，产出 CHANGELOG.txt，Release 附件增加 metafile.json
#   2. Node 版本 18 → 22：scripts/getChangeLog.mjs 使用 JSON 导入，
#      Node 18.20 会抛 ERR_IMPORT_ASSERTION_TYPE_MISSING
name: Auto release

on:
  push:
    tags: 
      - v*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: |
            - args: [--frozen-lockfile]

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: node scripts/getChangeLog.mjs > CHANGELOG.txt
      - run: pnpm i
      - name: Start build
        run: pnpm run build --metafile
      - run: mv dist/metafile-*.json metafile.json
      - name: Archive dist
        run: pnpm run archive
      - name: Github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
            metafile.json
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: CHANGELOG.txt