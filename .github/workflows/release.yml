# 与上游 apades/dmMiniPlayer v0.6.15 的差异（详见 NOTICE.md 第 33、41、42 项）：
#   1. 构建增加 --metafile，产出 CHANGELOG.txt，Release 附件增加 metafile.json
#   2. Node 版本 18 → 22。Node 22 移除了 `assert { type: 'json' }` 导入断言，
#      故 scripts/ 下三个脚本统一改用 `with { type: 'json' }`。
#      上游的 getChangeLog.mjs 原本完全缺少导入属性，任何 Node 版本都跑不起来。
#   3. 显式声明 contents: write，否则新建 Release 会 403（仓库默认工作流权限为只读）
name: Auto release

on:
  push:
    tags: 
      - v*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: |
            - args: [--frozen-lockfile]

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: node scripts/getChangeLog.mjs > CHANGELOG.txt
      - run: pnpm i
      - name: Start build
        run: pnpm run build --metafile
      - run: mv dist/metafile-*.json metafile.json
      - name: Archive dist
        run: pnpm run archive
      - name: Github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
            metafile.json
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: CHANGELOG.txt